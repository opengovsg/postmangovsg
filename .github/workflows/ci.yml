name: Lint and test
on:
  push:
    branches:
      - staging
      - master
  pull_request:
    branches:
      - staging
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: .nvmrc
      - name: Lint lock file
        run: npx lockfile-lint --type npm --path package-lock.json -o "https:" -o "file:" --allowed-hosts npm
      - run: npm ci --ignore-scripts
      - name: Lint app code
        run: npm run lint-no-fix
      - uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3.1.4
        with:
          python-version: "3.x"
      - run: pip install detect-secrets==1.2.0
      - run: npm run detect-secrets:check
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: --entrypoint redis-server
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: .nvmrc
      - name: Lint lock file
        run: npx lockfile-lint --type npm --path package-lock.json -o "https:" -o "file:" --allowed-hosts npm

      # building shared components from source file to avoid
      # "d.ts files are not built from source" errors
      - run: npm ci
        working-directory: ./shared
      - run: npm run build
        working-directory: ./shared

      - run: npm ci
      - name: Lint app code
        run: npm run lint-no-fix
      - name: Run tests
        run: npm test
  test-shared:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shared
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: .nvmrc
      - name: Lint lock file
        run: npx lockfile-lint --type npm --path package-lock.json -o "https:" -o "file:" --allowed-hosts npm
      - run: npm ci
      - name: Lint app code
        run: npm run lint-no-fix
      - name: Run tests
        run: npm test
  test-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./worker
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: .nvmrc
      - name: Lint lock file
        run: npx lockfile-lint --type npm --path package-lock.json -o "https:" -o "file:" --allowed-hosts npm

      # building shared components from source file to avoid
      # "d.ts files are not built from source" errors
      - run: npm ci
        working-directory: ./shared
      - run: npm run build
        working-directory: ./shared

      - run: npm ci
      - name: Lint app code
        run: npm run lint-no-fix
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: .nvmrc
      - name: Lint lock file
        run: npx lockfile-lint --type npm --path package-lock.json -o "https:" -o "file:" --allowed-hosts npm

      # building shared components from source file to avoid
      # "d.ts files are not built from source" errors
      - run: npm ci
        working-directory: ./shared
      - run: npm run build
        working-directory: ./shared

      - run: npm ci
      - run: npm run compile
      - name: Lint app code
        run: npm run lint-no-fix
      - name: Run tests
        run: npm test
